<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15151a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="rougarou: an indoor bouldering game at the rougarou rock lounge. walk the gym, pull onto a problem, move each hand and foot, shift your weight, send it.">
<title>rougarou</title>
<style>
	:root { --ink: #f3efe6; --dim: rgba(243, 239, 230, 0.68); --glass: rgba(16, 16, 20, 0.62); --tape: #f2a007; }
	* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
	html, body { margin: 0; height: 100%; background: #15151a; color: var(--ink); overflow: hidden; overscroll-behavior: none;
		font: 500 15px/1.35 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }
	#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
	.hud { position: fixed; left: 0; right: 0; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); }
	.top { top: 0; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
	.card { background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 12px; padding: 8px 12px; }
	#route { font-weight: 800; letter-spacing: 0.02em; font-size: 17px; }
	#route::before { content: "rougarou / "; color: var(--dim); font-weight: 600; }
	#status { color: var(--dim); max-width: min(560px, 92vw); }
	#status.warn { color: #ffb38a; }
	.pump { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--dim); }
	.bar { width: 64px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
	.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f2a007, #e2401b); }
	.bottom { bottom: 0; top: auto; padding-bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
	button { pointer-events: auto; font: inherit; font-weight: 700; color: var(--ink); background: var(--glass); border: 1px solid rgba(255, 255, 255, 0.14);
		border-radius: 999px; padding: 10px 16px; min-height: 44px; min-width: 44px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; }
	button:active { transform: scale(0.96); }
	button.hot { background: var(--tape); color: #1a1406; border-color: transparent; }
	[hidden] { display: none !important; }
	#tip { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(420px, calc(100vw - 32px));
		text-align: center; pointer-events: none; transition: opacity 0.6s; }
	#tip.gone { opacity: 0; }
	#sent { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
	#sent .card { pointer-events: auto; text-align: center; padding: 20px 24px; display: grid; gap: 12px; }
	#sent h2 { margin: 0; font-size: 34px; letter-spacing: 0.04em; color: var(--tape); }
	#sent div { display: flex; gap: 8px; justify-content: center; }
	.weight { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); }
	.weight .bar { width: 30px; }
	.weight .bar i { background: linear-gradient(90deg, #7fc8a9, #f2a007); }
	#stick { position: fixed; width: 116px; height: 116px; margin: -58px 0 0 -58px; border-radius: 50%; border: 2px solid rgba(243, 239, 230, 0.35);
		background: rgba(16, 16, 20, 0.25); pointer-events: none; }
	#stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(243, 239, 230, 0.55); }
	#loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); font-weight: 700; letter-spacing: 0.06em; }
	@media (max-width: 520px) {
		body { font-size: 13px; }
		#route { font-size: 15px; }
		button { padding: 8px 12px; }
		.keys { display: none; }
	}
	@media (pointer: coarse) { .keys { display: none; } }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">setting the problems...</div>
<div class="hud top">
	<div class="card"><div id="route"></div><div id="status"></div></div>
	<div class="card pump" id="pump">pump <span>L</span><span class="bar"><i id="pumpL"></i></span><span>R</span><span class="bar"><i id="pumpR"></i></span></div>
	<div class="card weight" id="weight">weight <span>hands</span><span class="bar"><i id="load3"></i></span><span class="bar"><i id="load2"></i></span><span>feet</span><span class="bar"><i id="load1"></i></span><span class="bar"><i id="load0"></i></span></div>
</div>
<div id="tip" class="card"></div>
<div class="hud bottom">
	<button id="prev" aria-label="previous problem">&lsaquo;</button>
	<button id="retry">retry</button>
	<button id="pull" class="hot" hidden>pull on</button>
	<button id="wide">gym</button>
	<button id="back" class="hot" hidden>put back</button>
	<button id="hang" hidden>let it hang</button>
	<button id="drop" hidden>jump down</button>
	<button id="next" aria-label="next problem">&rsaquo;</button>
	<span class="card keys" id="keys"></span>
</div>
<div id="sent" hidden><div class="card"><h2>SENT!</h2><div><button id="again">again</button><button id="onward" class="hot">jump down</button></div></div></div>
<div id="stick" hidden><i></i></div>
<script type="module" src="./main.js"></script>
</body>
</html>
