name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # every problem must still be sendable before the web build goes out
      - run: node web/check.mjs
      - run: npm ci --prefix tests/web-rig
      - run: npm test --prefix tests/web-rig
      - run: node --import ./tests/web-rig/register.mjs tests/web-rig/high-step.mjs
      - run: npm run audit --prefix tests/web-rig
      - run: python3 tools/stage-web.py "${{ runner.temp }}/rougarou-pages" "${{ github.sha }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/rougarou-pages
      - id: deployment
        uses: actions/deploy-pages@v4
